backend:
  name: github
  repo: KufreAntia/Kufreantia.com
  branch: main
  site_domain: www.kufreusenantia.com
  base_url: https://www.kufreusenantia.com
  auth_endpoint: api/auth/github

local_backend: true
publish_mode: simple
media_folder: public/uploads
public_folder: /uploads

collections:
  - name: pages
    label: Website pages
    files:
      - name: site
        label: Site details & CV
        file: src/data/site.json
        format: json
        fields:
          - { label: Full name, name: name, widget: string }
          - { label: Initials, name: shortName, widget: string }
          - { label: Search description, name: description, widget: text }
          - { label: Email, name: email, widget: string }
          - { label: Location, name: location, widget: string }
          - { label: LinkedIn URL, name: linkedin, widget: string, required: false }
          - { label: X / Twitter URL, name: twitter, widget: string, required: false }
          - { label: Downloadable CV, name: cvFile, widget: file }

      - name: home
        label: 1. Home
        file: src/data/home.json
        format: json
        fields:
          - { label: Professional label, name: eyebrow, widget: string }
          - { label: Main headline, name: headline, widget: string }
          - { label: Supporting copy, name: supportingCopy, widget: text }
          - { label: Professional introduction, name: professionalIntro, widget: text }
          - { label: Primary button, name: primaryCtaLabel, widget: string }
          - { label: Secondary button, name: secondaryCtaLabel, widget: string }
          - label: What I build cards
            name: areas
            widget: list
            fields:
              - { label: Title, name: title, widget: string }
              - { label: Summary, name: summary, widget: text }
              - { label: Link, name: href, widget: string }
          - { label: Featured experience title, name: featuredTitle, widget: string }
          - { label: Featured experience summary, name: featuredSummary, widget: text }
          - { label: Hero portrait, name: heroImage, widget: image, required: false, hint: "Natural professional portrait; vertical 4:5, at least 1600 px high." }
          - { label: Hero video, name: heroVideo, widget: string, required: false, hint: "Optional YouTube, Vimeo or MP4 URL." }
          - { label: Hero media alternative text, name: heroMediaAlt, widget: string }

      - name: about
        label: 2. About
        file: src/data/about.json
        format: json
        fields:
          - { label: Page introduction, name: intro, widget: text }
          - { label: Journey paragraphs, name: journey, widget: list, field: { label: Paragraph, name: paragraph, widget: text } }
          - { label: Approach and philosophy, name: philosophy, widget: text }
          - label: Education
            name: education
            widget: list
            fields:
              - { label: Qualification, name: qualification, widget: string }
              - { label: Institution, name: institution, widget: string }
              - { label: Result, name: result, widget: string }
              - { label: Year, name: year, widget: string }

      - name: cv_profile
        label: About — profile, skills & memberships
        file: src/data/cv.json
        format: json
        fields:
          - { label: Page introduction, name: pageIntroduction, widget: text }
          - { label: Lead profile, name: lead, widget: text }
          - { label: Full profile, name: profile, widget: text }
          - { label: Capabilities, name: capabilities, widget: list, field: { label: Capability, name: capability, widget: string } }
          - { label: Memberships and qualifications, name: memberships, widget: list, field: { label: Item, name: item, widget: string } }
          - { label: Selected achievements, name: achievements, widget: list, field: { label: Achievement, name: achievement, widget: string } }
          - { label: Profile image, name: profileImage, widget: image, required: false, hint: "Professional portrait; vertical 4:5, at least 1600 px high." }
          - { label: Profile video, name: profileVideo, widget: string, required: false }
          - { label: Profile media alternative text, name: profileMediaAlt, widget: string }

      - name: experience
        label: 3. Experience
        file: src/data/experience.json
        format: json
        fields:
          - { label: Page introduction, name: intro, widget: text }
          - { label: Engineering introduction, name: engineeringIntro, widget: text }
          - label: Engineering roles
            name: roles
            widget: list
            fields:
              - { label: Period, name: period, widget: string }
              - { label: Role, name: role, widget: string }
              - { label: Organisation, name: organisation, widget: string }
              - { label: Context, name: context, widget: text }
              - { label: Responsibilities and contribution, name: responsibilities, widget: list, field: { label: Item, name: item, widget: string } }
              - { label: Tools and methods, name: tools, widget: list, field: { label: Item, name: item, widget: string } }
          - label: Northumbria Construct
            name: northumbriaConstruct
            widget: object
            fields:
              - { label: Summary, name: summary, widget: text }
              - { label: Purpose, name: purpose, widget: text }
              - { label: External website, name: externalUrl, widget: string }
          - label: Northumbria Construct projects and initiatives
            name: initiatives
            widget: list
            fields:
              - { label: Title, name: title, widget: string }
              - { label: Status, name: status, widget: string }
              - { label: Summary, name: summary, widget: text }
          - label: NorCon Projects
            name: norcon
            widget: object
            fields:
              - { label: Status, name: status, widget: string }
              - { label: Summary, name: summary, widget: text }
              - { label: Purpose, name: purpose, widget: text }
              - { label: Product principles, name: principles, widget: list, field: { label: Principle, name: principle, widget: string } }

      - name: contributions
        label: 4. Contributions & Recognition
        file: src/data/contributions.json
        format: json
        fields:
          - { label: Page introduction, name: intro, widget: text }
          - label: Selected contributions
            name: selectedContributions
            widget: list
            fields:
              - { label: Type, name: type, widget: string }
              - { label: Title, name: title, widget: string }
              - { label: Role or context, name: role, widget: string }
              - { label: Summary, name: summary, widget: text }
          - label: Recent milestones
            name: recentMilestones
            widget: list
            fields:
              - { label: Year, name: year, widget: string }
              - { label: Title, name: title, widget: string }
              - { label: Organisation, name: organisation, widget: string }

      - name: contact
        label: 5. Contact
        file: src/data/contact.json
        format: json
        fields:
          - { label: Page introduction, name: pageIntroduction, widget: text }
          - { label: Heading, name: heading, widget: string }
          - { label: Invitation, name: body, widget: text }
          - { label: Contact portrait, name: contactImage, widget: image, required: false, hint: "Approachable professional portrait; vertical 4:5, at least 1600 px high." }
          - { label: Contact video, name: contactVideo, widget: string, required: false }
          - { label: Contact media alternative text, name: contactMediaAlt, widget: string }
